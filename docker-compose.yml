services:
  database:
    image: postgres:14
    environment:
      POSTGRES_DB: todos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    ports:
      - "65000:5000"
    depends_on:
      - database

  frontend:
    build: ./frontend
    ports:
      - "8080:80"


