name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build backend Docker image
        run: docker build -t ci-cd-todo-python-backend ./backend

      - name: Build frontend Docker image
        run: docker build -t ci-cd-todo-python-frontend ./frontend

